name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve the sample towns
        run: |
          set -euo pipefail
          node cli/resolve.mjs --year 1884 --place "Castrogiovanni" > /tmp/castro.json
          node cli/resolve.mjs --year 1852 --place Udine > /tmp/udine.json
          node cli/resolve.mjs --year 1910 --place Trento > /tmp/trento.json
          python3 - <<'PY'
          import json
          castro = json.load(open("/tmp/castro.json"))
          udine = json.load(open("/tmp/udine.json"))
          trento = json.load(open("/tmp/trento.json"))
          assert castro["modernName"] == "Enna", castro["modernName"]
          assert castro["istat"] == "086009"
          assert castro["historicalProvince"]["name"] == "Caltanissetta"
          assert udine["sovereign"]["id"] == "lombardo-veneto"
          assert udine["records"]["id"] == "parish"
          assert trento["historicalProvince"]["name"] == "Tirolo"
          assert "under Austrian rule" in trento["provinceShift"]["warning"]
          print("resolver ok")
          PY

      - name: Export the site bundle
        run: bash scripts/05_export_for_site.sh

      - name: Check relative asset paths
        run: |
          set -euo pipefail
          node --check dist/atlas/js/app.js
          node --check dist/atlas/js/engine.mjs
          node --check dist/atlas/js/router.js
          node --check dist/atlas/js/atlas-api.js
          if grep -nE 'fetch\("/|src="/|href="/' dist/atlas/index.html dist/atlas/js/*.js; then
            echo "absolute root path found"
            exit 1
          fi
          grep -q 'https://youratto.com/atlas' dist/atlas/index.html
          grep -q 'Copy Shareable Link' dist/atlas/index.html
          echo "bundle ok"
